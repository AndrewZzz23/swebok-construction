{% extends 'base.html' %}
{% block titulo %}{{ cat.titulo }}{% endblock %}
{% block contenido %}
<h1>{{ 'Editar' if fila else 'Nuevo' }} · {{ cat.titulo }}</h1>
<form method="post" class="tarjeta formulario">
  {% for col, etiqueta, tipo, origen in cat.campos %}
    <label>{{ etiqueta }}
    {% if tipo == 'fk' %}
      <select name="{{ col }}" required>
        {% for op in opciones[col] %}<option value="{{ op.id }}" {{ 'selected' if fila and fila[col] == op.id }}>{{ op.nombre }}</option>{% endfor %}
      </select>
    {% elif tipo == 'multiple' %}
      <span class="checks">
      {% for op in opciones[col] %}<label class="check"><input type="checkbox" name="{{ col }}" value="{{ op.id }}" {{ 'checked' if op.id in seleccionadas }}> {{ op.nombre }}</label>{% endfor %}
      </span>
    {% elif tipo == 'lista' %}
      <select name="{{ col }}">
        {% if origen is mapping %}
          {% for valor, texto in origen.items() %}<option value="{{ valor }}" {{ 'selected' if fila and fila[col] == valor }}>{{ texto }}</option>{% endfor %}
        {% else %}
          {% for valor in origen %}<option {{ 'selected' if fila and fila[col] == valor }}>{{ valor }}</option>{% endfor %}
        {% endif %}
      </select>
    {% else %}
      <input name="{{ col }}" type="{{ {'numero':'number','correo':'email'}.get(tipo, 'text') }}" value="{{ fila[col] if fila and fila[col] is not none else '' }}" {{ 'required' if col in ('nombre','codigo','direccion','documento','tiempo_estimado','identificacion') }} {{ 'min=0' if tipo == 'numero' }}>
    {% endif %}
    </label>
  {% endfor %}
  <div class="botones">
    <button>Guardar</button>
    <a href="{{ url_for('catalogo_lista', nombre=nombre) }}">Cancelar</a>
  </div>
</form>
{% endblock %}
